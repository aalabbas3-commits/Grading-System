<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf5ff">
  <title>نتيجة الطالب</title>
  <link rel="stylesheet" href="style.css?v=122">
  <script src="config.js?v=122"></script>
</head>

<body>
  <main class="app-shell">
    <header class="hero">
<div class="hero-copy">
        <h1>نتيجة الطالب</h1>
        <p>أدخل رقم الطالب أو السجل المدني للاطلاع على النتائج المنشورة</p>
      </div>
</header>

    <section class="content-wrap">
      <section class="panel search-panel" aria-labelledby="searchTitle">
        <div class="section-title-row">
          <div class="section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </div>

          <div class="section-title">
            <h2 id="searchTitle">البحث عن النتيجة</h2>
            <p>الرقم لا يقل عن 9 أرقام</p>
          </div>
        </div>

        <form id="searchForm" novalidate>
          <label for="studentId">رقم الطالب / السجل المدني</label>

          <div class="search-grid">
            <div class="input-wrap">
              <input
                id="studentId"
                name="student_id"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                enterkeyhint="search"
                maxlength="20"
                placeholder="أدخل رقم الطالب أو السجل المدني"
                aria-describedby="formMessage"
              >
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M5 20c.7-4 3.4-6 7-6s6.3 2 7 6"></path>
                </svg>
              </span>
            </div>

            <button id="searchButton" class="primary-button" type="submit">
              <span class="button-label">عرض النتيجة</span>
              <span class="button-search" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <path d="m16 16 4 4"></path>
                </svg>
              </span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>

          <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="resultArea" class="result-area" hidden>
        <article class="panel student-panel">
          <div class="student-avatar" aria-hidden="true"><img src="assets/student.png" alt=""></div>

          <div class="student-copy">
            <span class="eyebrow">الطالب</span>
            <h2 id="studentName">—</h2>
            <p id="studentClass">—</p>
          </div>
        </article>

        <section class="panel results-panel" aria-labelledby="resultsTitle">
          <div class="section-title-row results-title-row">
            <div class="section-icon section-icon--doc" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 3h8l4 4v14H7z"></path>
                <path d="M15 3v5h5"></path>
                <path d="M10 12h6M10 16h6"></path>
              </svg>
            </div>

            <div class="section-title">
              <h2 id="resultsTitle">النتائج المنشورة</h2>
              <p id="resultCount">—</p>
            </div>
          </div>

          <div id="resultsList" class="results-list"></div>

          <div class="published-note">
            <span class="note-icon" aria-hidden="true">i</span>
            <span>تظهر فقط الاختبارات التي تم نشر نتائجها.</span>
          </div>
        </section>
      </section>

      <section id="emptyState" class="panel empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">!</div>
        <h2 id="emptyTitle">لا توجد نتيجة</h2>
        <p id="emptyText">تحقق من الرقم ثم حاول مرة أخرى.</p>
      </section>
    </section>
  </main>

  <script src="app.js?v=122"></script>
</body>
</html>
